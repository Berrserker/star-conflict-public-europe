# SC Launcher 0.7.1 configuration (optional: the exe has these URLs built in;
# a key here overrides the built-in value, an empty value disables it).
# Game interface language: RUSSIAN or ENGLISH.
Language=RUSSIAN
# Prevent the Steam client launch from starting the bundled localhost server.
# Set to false if you intentionally want to use localhost.
SuppressLocalServer=true
# news.json on the site (the same file feeds the news block on the website).
NewsFeedUrl=https://star-conflict-eu-server.mak17.workers.dev/news.json
# Client mods (SCMOD1 manifest built by tools/build_mod_manifest.py).
ModManifestUrl=https://star-conflict-eu-server.mak17.workers.dev/sc-mods/manifest.txt
